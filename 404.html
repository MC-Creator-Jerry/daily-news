<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面无法打开 — 每日全球要闻</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #ffffff; --text: #1a1a2e; --sub: #6b7280;
    --accent: #4f6ef7; --border: #e5e7eb; --shadow: rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1117; --card: #1a1d27; --text: #e5e7eb; --sub: #9ca3af;
      --border: #2d3141; --shadow: rgba(0,0,0,0.3);
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .box {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 48px 36px; max-width: 440px; width: 100%; text-align: center;
    box-shadow: 0 8px 32px var(--shadow);
  }
  .icon {
    width: 72px; height: 72px; margin: 0 auto 24px;
    background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 32px; color: #fff;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  p { color: var(--sub); font-size: 14px; line-height: 1.7; margin-bottom: 8px; }
  .reasons {
    text-align: left; background: var(--bg); border-radius: 12px;
    padding: 16px 20px; margin: 20px 0; font-size: 13px; color: var(--sub); line-height: 1.9;
  }
  .reasons li { list-style: none; padding-left: 18px; position: relative; }
  .reasons li::before { content: '•'; position: absolute; left: 0; color: var(--accent); font-weight: 700; }
  .email {
    margin: 20px 0 8px; font-size: 14px; color: var(--text);
  }
  .email a {
    color: var(--accent); text-decoration: none; font-weight: 600;
    word-break: break-all;
  }
  .email a:hover { text-decoration: underline; }
  .btn {
    display: inline-block; margin-top: 16px;
    background: var(--accent); color: #fff; text-decoration: none;
    padding: 12px 28px; border-radius: 999px; font-size: 14px; font-weight: 600;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,110,247,.35); }
  footer { margin-top: 24px; font-size: 12px; color: var(--sub); }

  @media (max-width: 480px) {
    .box { padding: 36px 24px; }
    h1 { font-size: 19px; }
  }
</style>
<style id="xl-anim">
/* ===== 流畅动画系统 Smooth Animations (XL) ===== */
:root{
  --xl-ease: cubic-bezier(.22, 1, .36, 1);
  --xl-t-fast: .18s;
  --xl-t: .3s;
  --xl-t-slow: .6s;
}
html { scroll-behavior: smooth; }
@keyframes xlFade { from { opacity: 0; } to { opacity: 1; } }
@keyframes xlFadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
@keyframes xlPop { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }

/* 滚动揭示：仅透明度过渡，避免与悬浮位移冲突 */
.xl-reveal { opacity: 0; transition: opacity var(--xl-t-slow) var(--xl-ease); }
.xl-reveal.in { opacity: 1; }
.section-card, .prod-card, .feature-card { opacity: 0; transition: opacity var(--xl-t-slow) var(--xl-ease); }
.section-card.in, .prod-card.in, .feature-card.in { opacity: 1; }

/* 卡片悬浮微交互 */
.card, .news-card, .section-card, .prod-card, .feature-card, .post, .user-card {
  transition: transform var(--xl-t) var(--xl-ease), box-shadow var(--xl-t) var(--xl-ease), border-color var(--xl-t) var(--xl-ease);
}
.card:hover, .news-card:hover, .section-card:hover, .prod-card:hover, .feature-card:hover, .post:hover, .user-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 14px 32px rgba(0, 0, 0, .14);
}

/* 按钮 / 浮动钮：悬浮上浮 + 按压回弹 */
button, .bar-btn, .fab, .btn, .icon-btn {
  transition: transform var(--xl-t-fast) var(--xl-ease), box-shadow var(--xl-t) var(--xl-ease),
              background var(--xl-t) var(--xl-ease), color var(--xl-t) var(--xl-ease), border-color var(--xl-t) var(--xl-ease);
}
button:hover, .bar-btn:hover, .fab:hover, .btn:hover, .icon-btn:hover { transform: translateY(-2px); }
button:active, .bar-btn:active, .fab:active, .btn:active, .icon-btn:active { transform: scale(.93); }

/* 链接下划线滑入 */
a.xl-link, .nav-link, .bar-btn.link { position: relative; }
a.xl-link::after, .nav-link::after, .bar-btn.link::after {
  content: ''; position: absolute; left: 0; bottom: -2px; width: 100%; height: 2px;
  background: currentColor; transform: scaleX(0); transform-origin: left center;
  transition: transform var(--xl-t) var(--xl-ease);
}
a.xl-link:hover::after, .nav-link:hover::after, .bar-btn.link:hover::after { transform: scaleX(1); }

/* 模态 / 设置面板 / 下拉 / 弹层：淡入 + 弹出 */
.modal-overlay, .settings-overlay, .pop-menu, .user-popup, .dropdown { animation: xlFade var(--xl-t) var(--xl-ease); }
.modal-panel, .settings-panel, .modal-card, .pop-inner, .user-popup { animation: xlPop var(--xl-t) var(--xl-ease); }
.tab-pane { animation: xlFade var(--xl-t) var(--xl-ease); }

/* 新闻频道 / 条目展开时的内容揭示（利用 .open 触发，不改动 JS） */
.section-body.open { animation: xlFadeDown .34s var(--xl-ease) both; }
.item-body.open { animation: xlFadeDown .3s var(--xl-ease) both; }

/* 蓝条站点名 + 右下浮动按钮 入场（不动画 .topbar，避免影响固定导航条定位） */
.bar-left, .float-actions { animation: xlFade var(--xl-t-slow) var(--xl-ease) both; }

/* 图片淡入（仅对带 .xl-fade 的图片生效） */
img.xl-fade { opacity: 0; transition: opacity var(--xl-t) ease; }
img.xl-fade.loaded { opacity: 1; }

/* 无障碍：尊重减弱动画偏好 */
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .xl-reveal, .section-card, .prod-card, .feature-card { opacity: 1 !important; }
}
</style>
</head>
<body>
  <div class="box">
    <div class="icon">!</div>
    <h1>对不起，您访问的页面无法打开</h1>
    <p>可能遇到了以下问题，请您尝试排查：</p>
    <ul class="reasons">
      <li>网络连接不稳定或已断开</li>
      <li>该页面链接已过期或已被移除</li>
      <li>服务器暂时繁忙，请稍后刷新重试</li>
      <li>浏览器缓存异常，可尝试清除缓存</li>
    </ul>
    <p class="email">
      如果问题持续存在，欢迎联系：<br>
      <a href="mailto:jerryprdservice@163.com" style="color:#0078d4">jerryprdservice@163.com</a>
    </p>
    <button class="btn" type="button" onclick="history.back()">← 返回刚才</button>
    <a class="btn" href="index.html">← 返回新闻主页</a>
    <footer>每日全球要闻</footer>
  </div>
<script>
/* 所有链接默认新标签页打开，除了「返回主页」和页内锚点（用委托监听，覆盖动态生成的链接） */
(function(){
  function isHomeLink(a){
    var h = (a.getAttribute('href')||'').trim();
    if (h === 'index.html' || h.indexOf('index.html#') === 0) return true;
    var t = (a.textContent||'').trim();
    if (/返回主页|返回首页|back[\s-]?home/i.test(t)) return true;
    return false;
  }
  document.addEventListener('click', function(e){
    if (e.defaultPrevented) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // 保留系统自带的新开/下载手势
    var t = e.target;
    if (!t || !t.closest) return;
    var a = t.closest('a');
    if (!a) return;
    var h = (a.getAttribute('href')||'').trim();
    if (!h) return;
    if (h.charAt(0) === '#') return;                                   // 页内锚点
    if (/^(mailto:|tel:|javascript:)/i.test(h)) return;                // 邮箱/电话/脚本链接
    if (a.hasAttribute('download')) return;                            // 下载（如导出设置）
    if ((a.getAttribute('target')||'').toLowerCase() === '_self') return;
    if (isHomeLink(a)) return;                                         // 返回主页不新开
    e.preventDefault();
    window.open(h, '_blank', 'noopener');
  }, true);
})();
</script>
<script>
/* 流畅动画：滚动揭示 + 图片淡入 (XL) */
(function () {
  'use strict';
  var d = document;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SKIP = '.modal-overlay,.settings-overlay,.modal,.settings-panel,.pop-menu,.user-popup,.dropdown,.modal-card,.tab-pane';
  function tag() {
    var sel = '.section-card,.prod-card,.feature-card,.card,.post,.user-card,.product-card,.notice-item,.comment-item';
    d.querySelectorAll(sel).forEach(function (el) {
      if (el.closest && el.closest(SKIP)) return;
      if (el.classList.contains('xl-reveal') || el.classList.contains('in')) return;
      el.classList.add('xl-reveal');
    });
  }
  tag();
  if (reduce) {
    d.querySelectorAll('.xl-reveal,.section-card,.prod-card,.feature-card').forEach(function (e) { e.classList.add('in'); });
    return;
  }
  var els = d.querySelectorAll('.xl-reveal,.section-card,.prod-card,.feature-card');
  if (!('IntersectionObserver' in window) || !els.length) {
    els.forEach(function (e) { e.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (en) {
      if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, { threshold: 0.08, rootMargin: '0px 0px -6% 0px' });
  els.forEach(function (e) { io.observe(e); });
  d.querySelectorAll('img').forEach(function (img) {
    if (img.complete) img.classList.add('loaded');
    else img.addEventListener('load', function () { img.classList.add('loaded'); });
  });
})();
</script>

</body>
</html>

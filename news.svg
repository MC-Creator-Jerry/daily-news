<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="全球新闻">
  <defs>
    <linearGradient id="newsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a9bf0"/>
      <stop offset="100%" stop-color="#1f5fc8"/>
    </linearGradient>
  </defs>
  <circle cx="20" cy="20" r="20" fill="url(#newsBg)"/>
  <g>
    <!-- paper sheet -->
    <rect x="10.5" y="11" width="19" height="18" rx="2.4" fill="#ffffff" opacity="0.97"/>
    <!-- masthead -->
    <rect x="12.6" y="13.4" width="14.8" height="2.6" rx="1.2" fill="#1f5fc8"/>
    <!-- photo block -->
    <rect x="12.6" y="17.4" width="6" height="6" rx="1.2" fill="#1f5fc8" opacity="0.85"/>
    <!-- headline text lines -->
    <rect x="20" y="17.4" width="7.4" height="1.5" rx="0.75" fill="#1f5fc8" opacity="0.7"/>
    <rect x="20" y="20.1" width="7.4" height="1.5" rx="0.75" fill="#1f5fc8" opacity="0.7"/>
    <!-- body text lines -->
    <rect x="12.6" y="24.6" width="14.8" height="1.5" rx="0.75" fill="#1f5fc8" opacity="0.5"/>
    <rect x="12.6" y="27" width="11" height="1.5" rx="0.75" fill="#1f5fc8" opacity="0.5"/>
  </g>
</svg>